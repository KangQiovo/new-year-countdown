<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跨年倒计时 · 全屏北京时间</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.18), transparent 32%),
        radial-gradient(circle at 80% 0%, rgba(244, 114, 182, 0.2), transparent 30%),
        radial-gradient(circle at 10% 80%, rgba(94, 234, 212, 0.16), transparent 34%),
        linear-gradient(145deg, #0b1224, #050a18 60%, #020712);
      --glass: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.16);
      --text: #e5edff;
      --accent: #3dd5ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'HarmonyOS Sans', 'PingFang SC', 'Microsoft YaHei', system-ui;
      background-image: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .noise {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 2px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 2px);
      pointer-events: none;
      mix-blend-mode: soft-light;
      opacity: 0.2;
      z-index: 0;
    }

    canvas#sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    #time-particles {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      filter: drop-shadow(0 0 24px rgba(61, 213, 255, 0.28));
      transition: transform 0.9s ease;
      transform: translateY(0);
    }

    .time-info {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
      color: rgba(226, 232, 240, 0.85);
      letter-spacing: 4px;
      font-size: clamp(14px, 2vw, 22px);
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(0, 6, 18, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      transition: all 0.9s ease;
      z-index: 2;
    }

    #immersive-date {
      margin-top: 6px;
      display: block;
      font-weight: 700;
      letter-spacing: 5px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .countdown-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: rgba(11, 16, 36, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
      transition: all 0.9s ease;
      z-index: 3;
    }

    #countdown-value {
      font-size: clamp(18px, 3vw, 30px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #e2e8f0;
      text-shadow: 0 6px 18px rgba(0, 0, 0, 0.36);
      white-space: nowrap;
    }

    #countdown-title {
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.76;
    }

    .target-label {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(226, 232, 240, 0.9);
      transition: all 0.9s ease;
      z-index: 3;
      text-align: center;
    }

    .bottom-stack {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: min(90vw, 720px);
      z-index: 3;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      background: rgba(8, 12, 28, 0.6);
      backdrop-filter: blur(16px);
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.4);
      z-index: 3;
    }

    .controls input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .controls input:focus {
      border-color: rgba(61, 213, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(61, 213, 255, 0.18);
    }

    .controls button {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #3dd5ff, #ff8bd1);
      color: #0b1020;
      box-shadow: 0 16px 38px rgba(61, 213, 255, 0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .controls button:hover { transform: translateY(-1px) scale(1.01); }

    .danmaku-layer {
      position: fixed;
      inset: 0;
      pointer-events: auto;
      overflow: hidden;
      z-index: 2;
    }

    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      color: #f8fafc;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      animation: fly linear infinite;
      pointer-events: auto;
    }

    .danmaku-item::after {
      content: attr(data-time);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translate(-50%, -8px);
      padding: 6px 10px;
      background: rgba(9, 14, 28, 0.86);
      color: #c7e1ff;
      font-size: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .danmaku-item:hover::after,
    .danmaku-item:active::after {
      opacity: 1;
    }

    @keyframes fly {
      from { transform: translateX(110vw); }
      to { transform: translateX(-160vw); }
    }

    body.swap #time-particles {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="noise"></div>

  <canvas id="time-particles"></canvas>
  <div class="time-info">
    <div>北京时间 · UTC+8</div>
    <span id="immersive-date">0000-00-00</span>
    <div id="immersive-time" class="sr-only">--:--:--</div>
  </div>

  <div class="bottom-stack" id="bottom-stack">
    <div class="countdown-wrap" id="countdown-wrap">
      <div id="countdown-title">跨年倒计时</div>
      <div id="countdown-value">-- 天 -- 时 -- 分 -- 秒</div>
    </div>
    <div class="target-label" id="target-label">0000-00-00</div>
    <div class="controls">
      <input id="message" type="text" placeholder="写下你的新年祝福，所有人可见" maxlength="160" />
      <button id="send">发送弹幕</button>
    </div>
  </div>

  <div class="danmaku-layer" id="danmaku-layer"></div>

  <script>
    const immersiveTimeEl = document.getElementById('immersive-time');
    const immersiveDateEl = document.getElementById('immersive-date');
    const countdownValueEl = document.getElementById('countdown-value');
    const countdownWrap = document.getElementById('countdown-wrap');
    const targetLabelEl = document.getElementById('target-label');
    const messageInput = document.getElementById('message');
    const sendButton = document.getElementById('send');
    const danmakuLayer = document.getElementById('danmaku-layer');
    const timeCanvas = document.getElementById('time-particles');
    const timeCtx = timeCanvas.getContext('2d');
    const timeOffscreen = document.createElement('canvas');
    const timeOffCtx = timeOffscreen.getContext('2d');

    let serverOffset = 0;
    let blessings = [];
    const seenMessages = new Set();
    let timeParticles = [];
    let lastTimeString = '';
    let swapApplied = false;

    let targetTime = 0;

    function computeTargetTime() {
      const now = getBeijingNow();
      const targetYear = now.getFullYear() + 1;
      const targetDateString = `${targetYear}-01-01T00:00:00+08:00`;
      targetLabelEl.textContent = targetDateString.split('T')[0];
      return new Date(targetDateString).getTime();
    }

    let socket;
    let reconnectTimer;
    const pendingQueue = [];

    function connectSocket() {
      const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
      socket = new WebSocket(url);

      socket.addEventListener('open', () => {
        clearTimeout(reconnectTimer);
        if (pendingQueue.length) {
          pendingQueue.splice(0).forEach((payload) => socket.send(JSON.stringify(payload)));
        }
        fetchBlessings();
      });

      socket.addEventListener('message', (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'init') {
          serverOffset = data.now - Date.now();
          targetTime = computeTargetTime();
          ingestBlessings(data.messages);
        }
        if (data.type === 'time') {
          serverOffset = data.now - Date.now();
        }
        if (data.type === 'blessing') {
          blessings.push(data.message);
          pushDanmaku(data.message);
        }
      });

      socket.addEventListener('close', () => {
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectSocket, 1200);
      });

      socket.addEventListener('error', () => {
        socket.close();
      });
    }

    connectSocket();

    async function fetchBlessings() {
      try {
        const res = await fetch('/api/blessings', { cache: 'no-store' });
        if (!res.ok) return;
        const list = await res.json();
        ingestBlessings(list);
      } catch (err) {
        console.error('Failed to fetch blessings', err);
      }
    }

    function resizeTimeCanvas() {
      timeCanvas.width = window.innerWidth;
      timeCanvas.height = window.innerHeight;
      timeOffscreen.width = window.innerWidth;
      timeOffscreen.height = window.innerHeight;
      if (lastTimeString) {
        buildTimeParticles(lastTimeString);
        drawTimeParticles();
      }
    }
    window.addEventListener('resize', resizeTimeCanvas);
    resizeTimeCanvas();

    targetTime = computeTargetTime();
    fetchBlessings();

    function format(num) { return num.toString().padStart(2, '0'); }

    function getServerNow() {
      return new Date(Date.now() + serverOffset);
    }

    function getBeijingNow() {
      const now = getServerNow();
      return new Date(now.getTime() + (8 * 60 + now.getTimezoneOffset()) * 60000);
    }

    function buildTimeParticles(timeStr) {
      lastTimeString = timeStr;
      timeOffCtx.clearRect(0, 0, timeOffscreen.width, timeOffscreen.height);
      const fontSize = Math.min(timeCanvas.width * 0.2, timeCanvas.height * 0.26);
      timeOffCtx.font = `900 ${fontSize}px 'Inter', 'HarmonyOS Sans', 'Montserrat', sans-serif`;
      timeOffCtx.textAlign = 'center';
      timeOffCtx.textBaseline = 'middle';
      timeOffCtx.fillStyle = '#d9f1ff';
      const centerY = timeOffscreen.height * 0.52;
      timeOffCtx.fillText(timeStr, timeOffscreen.width / 2, centerY);

      const gap = 8;
      const maxParticles = 2400;
      const imageData = timeOffCtx.getImageData(0, 0, timeOffscreen.width, timeOffscreen.height).data;
      const rawPoints = [];
      for (let y = 0; y < timeOffscreen.height; y += gap) {
        for (let x = 0; x < timeOffscreen.width; x += gap) {
          const idx = (y * timeOffscreen.width + x) * 4 + 3;
          if (imageData[idx] > 80) rawPoints.push({ x, y });
        }
      }

      const step = Math.max(1, Math.ceil(rawPoints.length / maxParticles));
      const points = rawPoints.filter((_, i) => i % step === 0);
      timeParticles = points.map((pt) => ({
        x: pt.x,
        y: pt.y,
        size: 1 + ((pt.x + pt.y) % 6) * 0.15,
        color: particleColor(pt.x, pt.y),
      }));
    }

    function drawTimeParticles() {
      timeCtx.clearRect(0, 0, timeCanvas.width, timeCanvas.height);
      timeParticles.forEach((p) => {
        timeCtx.fillStyle = p.color;
        timeCtx.beginPath();
        timeCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        timeCtx.fill();
      });
    }

    function particleColor(x, y) {
      const hue = 190 + ((x + y) % 90);
      const light = 68 + ((x * 3 + y * 5) % 12);
      return `hsla(${hue}, 80%, ${light}%, 0.9)`;
    }

    function formatCountdown(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return `${days} 天 ${format(hours)} 时 ${format(minutes)} 分 ${format(seconds)} 秒`;
    }

    function updateCountdown(now) {
      let remaining = targetTime - now.getTime();
      if (remaining <= 0) {
        targetTime = computeTargetTime();
        remaining = targetTime - now.getTime();
      }
      countdownValueEl.textContent = formatCountdown(remaining);
      if (remaining <= 600000 && !swapApplied) {
        document.body.classList.add('swap');
        swapApplied = true;
      }
    }

    function tickTime() {
      const beijingNow = getBeijingNow();
      const hh = format(beijingNow.getHours());
      const mm = format(beijingNow.getMinutes());
      const ss = format(beijingNow.getSeconds());
      const timeStr = `${hh}:${mm}:${ss}`;
      if (timeStr !== lastTimeString) {
        buildTimeParticles(timeStr);
        drawTimeParticles();
      }
      immersiveTimeEl.textContent = timeStr;
      immersiveDateEl.textContent = `${beijingNow.getFullYear()}-${format(beijingNow.getMonth() + 1)}-${format(beijingNow.getDate())}`;
      updateCountdown(new Date(Date.now() + serverOffset));
      requestAnimationFrame(tickTime);
    }
    tickTime();

    function formatBeijingDateTime(ms) {
      return new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        hour12: false,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      }).format(ms);
    }

    function pushDanmaku(message) {
      if (!message || !message.text) return;
      if (message.id && seenMessages.has(message.id)) return;
      if (message.id) seenMessages.add(message.id);
      spawnDanmaku(message);
    }

    function spawnDanmaku(message) {
      const el = document.createElement('div');
      el.className = 'danmaku-item';
      el.textContent = message.text;
      el.dataset.time = formatBeijingDateTime(message.createdAt || Date.now());
      el.title = `发送于 ${el.dataset.time} (UTC+8)`;

      const layerHeight = danmakuLayer.clientHeight || window.innerHeight;
      const top = Math.random() * (layerHeight - 48) + 8;
      el.style.top = `${top}px`;
      const duration = 8 + Math.random() * 6;
      el.style.animationDuration = `${duration}s`;
      danmakuLayer.appendChild(el);

      const delay = -Math.random() * duration;
      el.style.animationDelay = `${delay}s`;
    }

    function ingestBlessings(list) {
      if (!Array.isArray(list)) return;
      const sorted = [...list].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      sorted.forEach((msg, idx) => {
        if (msg.id && seenMessages.has(msg.id)) return;
        blessings.push(msg);
        setTimeout(() => pushDanmaku(msg), idx * 120);
      });
    }

    async function postBlessing(payload) {
      try {
        const res = await fetch('/api/blessings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        return res.ok;
      } catch (err) {
        console.warn('post fallback failed', err);
        return false;
      }
    }

    function sendBlessing() {
      const text = messageInput.value.trim();
      if (!text) return;
      const id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString();
      const createdAt = Date.now() + serverOffset;
      const payload = { type: 'blessing', text, id, createdAt };
      const message = { id, text, createdAt };
      pushDanmaku(message);
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(payload));
      } else {
        postBlessing(payload).then((ok) => {
          if (!ok) pendingQueue.push(payload);
        });
      }
      messageInput.value = '';
    }

    sendButton.addEventListener('click', sendBlessing);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendBlessing();
      }
    });

    // Fireworks background (minimal, reusing prior particle logic)
    const sky = document.getElementById('sky');
    const skyCtx = sky.getContext('2d');
    let particles = [];
    let lastTime = 0;

    function resizeSky() {
      sky.width = window.innerWidth;
      sky.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeSky);
    resizeSky();

    function createBurst(x, y) {
      const hue = Math.random() * 360;
      for (let i = 0; i < 80; i++) {
        particles.push({
          x,
          y,
          angle: Math.random() * Math.PI * 2,
          speed: Math.random() * 4 + 1.5,
          radius: Math.random() * 2 + 0.6,
          color: `hsla(${hue + Math.random() * 40 - 20}, 85%, 65%, 0.9)`,
          alpha: 1,
        });
      }
    }

    function animateSky(ts) {
      const delta = ts - lastTime;
      lastTime = ts;
      skyCtx.fillStyle = 'rgba(5, 10, 24, 0.35)';
      skyCtx.fillRect(0, 0, sky.width, sky.height);

      particles.forEach((p) => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed + 0.4;
        p.speed *= 0.986;
        p.alpha -= 0.008;
        skyCtx.globalAlpha = Math.max(p.alpha, 0);
        const gradient = skyCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 4);
        gradient.addColorStop(0, p.color);
        gradient.addColorStop(1, 'transparent');
        skyCtx.fillStyle = gradient;
        skyCtx.beginPath();
        skyCtx.arc(p.x, p.y, p.radius * 3.2, 0, Math.PI * 2);
        skyCtx.fill();
      });
      particles = particles.filter((p) => p.alpha > 0);

      if (delta > 0 && Math.random() < 0.015) {
        createBurst(Math.random() * sky.width, Math.random() * sky.height * 0.6 + sky.height * 0.1);
      }
      requestAnimationFrame(animateSky);
    }
    animateSky(0);
  </script>
</body>
</html>
