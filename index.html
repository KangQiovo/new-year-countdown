<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跨年倒计时 · 全球共享祝福</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.18), transparent 32%),
        radial-gradient(circle at 80% 0%, rgba(244, 114, 182, 0.2), transparent 30%),
        radial-gradient(circle at 10% 80%, rgba(94, 234, 212, 0.16), transparent 34%),
        linear-gradient(145deg, #0b1224, #050a18 60%, #020712);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
      --accent: #3dd5ff;
      --accent-2: #ff8bd1;
      --text: #e5edff;
      --subtle: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'HarmonyOS Sans', 'PingFang SC', 'Microsoft YaHei', system-ui;
      background-image: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 2px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 2px);
      pointer-events: none;
      mix-blend-mode: soft-light;
      opacity: 0.2;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .immersive-time {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
      color: #ecfeff;
      text-align: center;
      background: radial-gradient(circle at 50% 45%, rgba(61, 213, 255, 0.08), transparent 38%),
        radial-gradient(circle at 45% 55%, rgba(255, 139, 209, 0.07), transparent 36%);
    }

    .time-shell {
      display: grid;
      gap: 14px;
      padding: clamp(18px, 5vw, 48px) clamp(22px, 6vw, 64px);
      background: rgba(0, 6, 18, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 30px 120px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(18px);
      max-width: 90vw;
    }

    .time-label {
      font-size: clamp(15px, 2vw, 22px);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(226, 232, 240, 0.8);
    }

    #immersive-time {
      font-size: clamp(64px, 18vw, 240px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: clamp(6px, 1.2vw, 16px);
      text-shadow: 0 0 30px rgba(61, 213, 255, 0.55), 0 10px 60px rgba(5, 10, 24, 0.9);
    }

    #immersive-date {
      font-size: clamp(20px, 3vw, 34px);
      letter-spacing: 6px;
      color: rgba(226, 232, 240, 0.8);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(135deg, rgba(61, 213, 255, 0.25), rgba(255, 139, 209, 0.2));
      border: 1px solid var(--border);
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 12px 40px rgba(61, 213, 255, 0.25);
    }

    .pill strong {
      color: #fff;
    }

    .chip-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--subtle);
      font-weight: 600;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .chip.glow {
      color: #a5f3fc;
      background: linear-gradient(135deg, rgba(61, 213, 255, 0.22), rgba(255, 139, 209, 0.15));
      border-color: rgba(61, 213, 255, 0.35);
      box-shadow: 0 15px 35px rgba(61, 213, 255, 0.25);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
    }

    .hero-card {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 26px 24px 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .hero-card::before,
    .hero-card::after {
      content: '';
      position: absolute;
      filter: blur(40px);
      opacity: 0.55;
      pointer-events: none;
    }

    .hero-card::before {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(61, 213, 255, 0.35), transparent 60%);
      top: -160px;
      left: -60px;
    }

    .hero-card::after {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 139, 209, 0.3), transparent 60%);
      bottom: -120px;
      right: -40px;
    }

    .hero-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .hero-title {
      font-size: 22px;
      font-weight: 700;
      color: #cbd5ff;
      letter-spacing: 0.6px;
    }

    .hero-sub {
      color: var(--subtle);
      font-weight: 600;
    }

    .digit-wrap {
      position: relative;
      margin: 10px -8px 4px;
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    #digit-canvas {
      width: 100%;
      height: clamp(220px, 38vw, 360px);
      display: block;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 10px 0 8px;
      position: relative;
      z-index: 1;
    }

    .stat {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      display: flex;
      align-items: baseline;
      gap: 10px;
      backdrop-filter: blur(8px);
    }

    .stat strong {
      font-size: 28px;
      letter-spacing: 1px;
    }

    .stat label {
      color: var(--subtle);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 12px;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      max-width: 820px;
      margin: 0 auto;
      transform: scale(0.94);
      transform-origin: center;
    }

    .form-card input,
    .form-card textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      outline: none;
      font-size: 13px;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: none;
    }

    .form-card input:focus,
    .form-card textarea:focus {
      border-color: rgba(61, 213, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(61, 213, 255, 0.18);
    }

    .form-card textarea {
      min-height: 48px;
    }

    .form-card button {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #3dd5ff, #ff8bd1);
      color: #0b1020;
      box-shadow: 0 16px 38px rgba(61, 213, 255, 0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .form-card button:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 18px 40px rgba(255, 139, 209, 0.4);
    }

    .ticker {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      min-height: 46px;
      display: flex;
      align-items: center;
      padding: 6px 0;
      max-width: 880px;
      margin: 0 auto;
      transform: scale(0.95);
      transform-origin: center;
    }

    .ticker::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(5, 10, 24, 0.85), transparent 12%, transparent 88%, rgba(5, 10, 24, 0.85));
      pointer-events: none;
    }

    .ticker-track {
      display: flex;
      gap: 18px;
      white-space: nowrap;
      animation: marquee 22s linear infinite;
    }

    .ticker.paused .ticker-track {
      animation-play-state: paused;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.07);
      padding: 8px 12px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      position: relative;
    }

    .ticker-item small { color: #cbd5e1; font-weight: 600; font-size: 11px; }
    .ticker-item strong { color: #f8fafc; font-size: 13px; }

    .ticker-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(61, 213, 255, 0.18), transparent 55%);
      pointer-events: none;
    }

    .celebrate .ticker-item { animation: float-up 1.9s ease forwards; }
    @keyframes float-up {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      60% { transform: translateY(-140px) scale(1.05); opacity: 1; }
      100% { transform: translateY(-260px) scale(0.9); opacity: 0; }
    }

    canvas#sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .footer {
      text-align: center;
      color: var(--subtle);
      font-size: 14px;
      padding-top: 6px;
    }

    @media (max-width: 720px) {
      main { padding: 20px 16px 32px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .hero-title { font-size: 18px; }
      .stat strong { font-size: 24px; }
      #digit-canvas { height: clamp(200px, 55vw, 280px); }
      .form-card { grid-template-columns: 1fr; }
      .form-card button { width: 100%; }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="noise"></div>
  <div class="immersive-time">
    <div class="time-shell">
      <div class="time-label">北京时间 · UTC+8</div>
      <div id="immersive-time">--:--:--</div>
      <div id="immersive-date">0000-00-00</div>
    </div>
  </div>
  <main>
    <div class="topbar">
      <div class="pill">COUNTDOWN TO <strong id="target-year">2025</strong></div>
      <div class="chip-row">
        <div class="chip glow" id="summary-count">--</div>
        <div class="chip" id="current-time">--:--:-- UTC+8</div>
        <div class="chip"><span class="dot" id="ws-status"></span> 实时同步</div>
      </div>
    </div>

    <section class="hero-card">
      <div class="hero-header">
        <div>
          <div class="hero-title">迎接崭新的一年</div>
          <div class="hero-sub">实时同步 · 粒子化时间 · 全站共享祝福</div>
        </div>
      </div>

      <div class="digit-wrap">
        <canvas id="digit-canvas"></canvas>
      </div>

      <div class="stat-row">
        <div class="stat"><strong id="days">--</strong><label>Days</label></div>
        <div class="stat"><strong id="hours">--</strong><label>Hours</label></div>
        <div class="stat"><strong id="minutes">--</strong><label>Minutes</label></div>
        <div class="stat"><strong id="seconds">--</strong><label>Seconds</label></div>
      </div>
    </section>

    <section class="form-card">
      <div style="display: grid; grid-template-columns: 1fr; gap: 8px;">
        <input id="author" type="text" placeholder="昵称（可选，默认“游客”）" maxlength="32" />
        <textarea id="message" rows="1" placeholder="写下你的新年祝福，让所有人看到" maxlength="160"></textarea>
      </div>
      <button id="send">送出祝福</button>
    </section>

    <section class="ticker" id="ticker">
      <div class="ticker-track" id="ticker-track"></div>
    </section>

    <div class="footer">愿你的祝福在新年绽放，照亮每一刻</div>
  </main>

  <script>
    const wsStatus = document.getElementById('ws-status');
    const currentTimeEl = document.getElementById('current-time');
    const immersiveTimeEl = document.getElementById('immersive-time');
    const immersiveDateEl = document.getElementById('immersive-date');
    const targetYearEl = document.getElementById('target-year');
    const summaryCountEl = document.getElementById('summary-count');
    const ids = ['days', 'hours', 'minutes', 'seconds'].reduce((acc, id) => {
      acc[id] = document.getElementById(id);
      return acc;
    }, {});

    const ticker = document.getElementById('ticker');
    const tickerTrack = document.getElementById('ticker-track');
    const authorInput = document.getElementById('author');
    const messageInput = document.getElementById('message');
    const sendButton = document.getElementById('send');

    let blessings = [];
    let serverOffset = 0;
    let hasCelebrated = false;

    const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);

    socket.addEventListener('open', () => { wsStatus.style.background = '#22c55e'; });
    socket.addEventListener('close', () => { wsStatus.style.background = '#ef4444'; });

    socket.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'init') {
        serverOffset = data.now - Date.now();
        blessings = data.messages || [];
        renderTicker();
      }
      if (data.type === 'time') {
        serverOffset = data.now - Date.now();
      }
      if (data.type === 'blessing') {
        blessings.push(data.message);
        blessings = blessings.slice(-200);
        appendTickerItem(data.message);
      }
    });

    sendButton.addEventListener('click', () => {
      const text = messageInput.value.trim();
      if (!text) return alert('请输入祝福语');
      socket.send(
        JSON.stringify({
          type: 'blessing',
          text,
          author: authorInput.value.trim() || '游客',
        })
      );
      messageInput.value = '';
    });

    function getUtc8Now() {
      return new Date(Date.now() + serverOffset + 8 * 60 * 60 * 1000);
    }

    function targetUtcTimestamp() {
      const now = getUtc8Now();
      const year = now.getUTCFullYear();
      return Date.UTC(year + 1, 0, 1, -8); // next Jan 1 00:00 at UTC+8
    }

    function updateCountdown() {
      const now = Date.now() + serverOffset;
      const diff = targetUtcTimestamp() - now;
      const reached = diff <= 0;

      const totalSeconds = Math.max(0, Math.floor(diff / 1000));
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      ids.days.textContent = String(days).padStart(2, '0');
      ids.hours.textContent = String(hours).padStart(2, '0');
      ids.minutes.textContent = String(minutes).padStart(2, '0');
      ids.seconds.textContent = String(seconds).padStart(2, '0');

      summaryCountEl.textContent = `${days}D ${String(hours).padStart(2, '0')}H ${String(minutes).padStart(2, '0')}M ${String(seconds).padStart(2, '0')}S`;
      const nowUtc8 = getUtc8Now();
      const displayTime = nowUtc8.toISOString().slice(11, 19);
      currentTimeEl.textContent = `${displayTime} UTC+8`;
      immersiveTimeEl.textContent = displayTime;
      const mm = String(nowUtc8.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(nowUtc8.getUTCDate()).padStart(2, '0');
      immersiveDateEl.textContent = `${nowUtc8.getUTCFullYear()}-${mm}-${dd}`;
      targetYearEl.textContent = nowUtc8.getUTCFullYear() + 1;
      updateDigitTime(displayTime);

      if (reached && !hasCelebrated) {
        hasCelebrated = true;
        celebrate();
      }
    }

    function renderTicker() {
      tickerTrack.innerHTML = '';
      const items = [...blessings, ...blessings];
      items.forEach((item) => appendTickerItem(item));
    }

    function appendTickerItem(item) {
      const el = document.createElement('div');
      el.className = 'ticker-item';
      el.innerHTML = `<small>🎉 ${escapeHtml(item.author)}</small><strong>${escapeHtml(item.text)}</strong>`;
      tickerTrack.appendChild(el);
      if (tickerTrack.children.length > 0 && tickerTrack.children.length % (blessings.length || 1) === 0) {
        tickerTrack.style.animationDuration = Math.max(14, blessings.length * 0.9) + 's';
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function celebrate() {
      ticker.classList.add('celebrate');
      releaseFireworksFromMessages();
      setTimeout(() => ticker.classList.remove('celebrate'), 2500);
      burstSky(12);
    }

    // Fireworks implementation
    const skyCanvas = document.getElementById('sky');
    const skyCtx = skyCanvas.getContext('2d');
    let width, height;

    function resizeSky() {
      width = skyCanvas.width = window.innerWidth;
      height = skyCanvas.height = window.innerHeight;
      resizeDigits();
    }
    window.addEventListener('resize', resizeSky);
    resizeSky();

    const particles = [];
    function createParticle(x, y, color) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        radius: Math.random() * 3 + 1.5,
        color,
      });
    }

    function burstSky(times = 8) {
      for (let i = 0; i < times; i++) {
        setTimeout(() => {
          const x = Math.random() * width;
          const y = Math.random() * height * 0.6;
          for (let j = 0; j < 80; j++) createParticle(x, y, randomColor());
        }, i * 320 + Math.random() * 140);
      }
    }

    function releaseFireworksFromMessages() {
      const rect = ticker.getBoundingClientRect();
      const items = Array.from(tickerTrack.children);
      items.forEach((item, idx) => {
        const x = (idx / Math.max(1, items.length)) * width + Math.random() * 40 - 20;
        const y = rect.top + Math.random() * rect.height;
        for (let j = 0; j < 40; j++) createParticle(x, y, randomColor());
      });
    }

    function randomColor() {
      const palette = ['#3dd5ff', '#ff8bd1', '#fbbf24', '#a855f7', '#38bdf8'];
      return palette[Math.floor(Math.random() * palette.length)];
    }

    function animateSky() {
      skyCtx.fillStyle = 'rgba(5, 9, 20, 0.3)';
      skyCtx.fillRect(0, 0, width, height);

      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03;
        p.alpha -= 0.007;
        skyCtx.globalAlpha = Math.max(p.alpha, 0);
        const gradient = skyCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 4);
        gradient.addColorStop(0, p.color);
        gradient.addColorStop(1, 'transparent');
        skyCtx.fillStyle = gradient;
        skyCtx.beginPath();
        skyCtx.arc(p.x, p.y, p.radius * 3.5, 0, Math.PI * 2);
        skyCtx.fill();
      });

      for (let i = particles.length - 1; i >= 0; i--) if (particles[i].alpha <= 0) particles.splice(i, 1);
      requestAnimationFrame(animateSky);
    }
    animateSky();

    // Digit particles
    const digitCanvas = document.getElementById('digit-canvas');
    const digitCtx = digitCanvas.getContext('2d');
    const offscreen = document.createElement('canvas');
    const offCtx = offscreen.getContext('2d');
    let digitParticles = [];

    function resizeDigits() {
      digitCanvas.width = digitCanvas.offsetWidth;
      digitCanvas.height = digitCanvas.offsetHeight;
      offscreen.width = digitCanvas.width;
      offscreen.height = digitCanvas.height;
    }

    function createDigitParticle(x = Math.random() * digitCanvas.width, y = digitCanvas.height + Math.random() * 80) {
      return {
        x,
        y,
        tx: x,
        ty: y,
        alpha: 0,
        speed: Math.random() * 0.04 + 0.06,
        size: Math.random() * 2 + 1.2,
      };
    }

    function buildTargets(text) {
      offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
      const baseSize = Math.min(offscreen.width / 5.4, offscreen.height * 0.8);
      offCtx.font = `900 ${baseSize}px 'Inter', 'Space Grotesk', system-ui`;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillStyle = '#fff';
      offCtx.fillText(text, offscreen.width / 2, offscreen.height / 2 + baseSize * 0.08);

      const { data, width: w, height: h } = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
      const gap = 6;
      const targets = [];
      for (let y = 0; y < h; y += gap) {
        for (let x = 0; x < w; x += gap) {
          const idx = (y * w + x) * 4 + 3;
          if (data[idx] > 120) targets.push({ x, y });
        }
      }
      return targets;
    }

    function updateDigitTime(timeStr) {
      const targets = buildTargets(timeStr);
      if (digitParticles.length < targets.length) {
        const need = targets.length - digitParticles.length;
        for (let i = 0; i < need; i++) digitParticles.push(createDigitParticle());
      }

      digitParticles.forEach((p, i) => {
        if (i < targets.length) {
          p.tx = targets[i].x + (Math.random() - 0.5) * 2;
          p.ty = targets[i].y + (Math.random() - 0.5) * 2;
          p.alpha = Math.min(1, p.alpha + 0.08);
        } else {
          p.ty = digitCanvas.height + 80;
          p.alpha = Math.max(0, p.alpha - 0.05);
        }
      });
    }

    function animateDigits() {
      digitCtx.clearRect(0, 0, digitCanvas.width, digitCanvas.height);
      const gradient = digitCtx.createRadialGradient(
        digitCanvas.width / 2,
        digitCanvas.height / 2,
        40,
        digitCanvas.width / 2,
        digitCanvas.height / 2,
        digitCanvas.width * 0.6
      );
      gradient.addColorStop(0, 'rgba(61, 213, 255, 0.18)');
      gradient.addColorStop(1, 'rgba(5, 10, 24, 0.0)');
      digitCtx.fillStyle = gradient;
      digitCtx.fillRect(0, 0, digitCanvas.width, digitCanvas.height);

      digitParticles.forEach((p) => {
        p.x += (p.tx - p.x) * (p.speed + 0.02);
        p.y += (p.ty - p.y) * (p.speed + 0.02);
        p.alpha *= 0.995 + Math.random() * 0.003;

        const size = p.size + Math.random() * 0.5;
        const g = digitCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 4);
        g.addColorStop(0, 'rgba(255,255,255,0.95)');
        g.addColorStop(1, 'rgba(61, 213, 255, 0)');
        digitCtx.globalAlpha = p.alpha;
        digitCtx.fillStyle = g;
        digitCtx.beginPath();
        digitCtx.arc(p.x, p.y, size * 3.2, 0, Math.PI * 2);
        digitCtx.fill();
      });

      requestAnimationFrame(animateDigits);
    }

    resizeDigits();
    animateDigits();

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
