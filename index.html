<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跨年倒计时 · 全屏北京时间</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.18), transparent 32%),
        radial-gradient(circle at 80% 0%, rgba(244, 114, 182, 0.2), transparent 30%),
        radial-gradient(circle at 10% 80%, rgba(94, 234, 212, 0.16), transparent 34%),
        linear-gradient(145deg, #0b1224, #050a18 60%, #020712);
      --glass: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.16);
      --text: #e5edff;
      --accent: #3dd5ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'HarmonyOS Sans', 'PingFang SC', 'Microsoft YaHei', system-ui;
      background-image: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .noise {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 2px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 2px);
      pointer-events: none;
      mix-blend-mode: soft-light;
      opacity: 0.2;
      z-index: 0;
    }

    canvas#sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .time-stage {
      position: relative;
      z-index: 1;
      text-align: center;
      display: grid;
      gap: clamp(12px, 2vw, 24px);
      padding: clamp(18px, 5vw, 48px);
      background: rgba(0, 6, 18, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 30px 120px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(18px);
      max-width: min(92vw, 1200px);
    }

    .time-label {
      font-size: clamp(14px, 2vw, 22px);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(226, 232, 240, 0.8);
    }

    #immersive-time {
      font-size: clamp(72px, 20vw, 260px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: clamp(6px, 1.2vw, 20px);
      text-shadow: 0 0 40px rgba(61, 213, 255, 0.55), 0 10px 60px rgba(5, 10, 24, 0.9);
    }

    #immersive-date {
      font-size: clamp(18px, 3vw, 32px);
      letter-spacing: 6px;
      color: rgba(226, 232, 240, 0.78);
    }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      width: min(90vw, 600px);
      background: rgba(8, 12, 28, 0.6);
      backdrop-filter: blur(16px);
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.4);
      z-index: 3;
    }

    .controls input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .controls input:focus {
      border-color: rgba(61, 213, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(61, 213, 255, 0.18);
    }

    .controls button {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #3dd5ff, #ff8bd1);
      color: #0b1020;
      box-shadow: 0 16px 38px rgba(61, 213, 255, 0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .controls button:hover { transform: translateY(-1px) scale(1.01); }

    .danmaku-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      color: #f8fafc;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      animation: fly linear forwards;
    }

    @keyframes fly {
      from { transform: translateX(120%); }
      to { transform: translateX(-150%); }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="noise"></div>

  <div class="time-stage">
    <div class="time-label">北京时间 · UTC+8</div>
    <div id="immersive-time">--:--:--</div>
    <div id="immersive-date">0000-00-00</div>
  </div>

  <div class="controls">
    <input id="message" type="text" placeholder="写下你的新年祝福，所有人可见" maxlength="160" />
    <button id="send">发送弹幕</button>
  </div>

  <div class="danmaku-layer" id="danmaku-layer"></div>

  <script>
    const immersiveTimeEl = document.getElementById('immersive-time');
    const immersiveDateEl = document.getElementById('immersive-date');
    const messageInput = document.getElementById('message');
    const sendButton = document.getElementById('send');
    const danmakuLayer = document.getElementById('danmaku-layer');

    let serverOffset = 0;
    let blessings = [];

    const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);

    socket.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'init') {
        serverOffset = data.now - Date.now();
        blessings = data.messages || [];
        blessings.forEach(pushDanmaku);
      }
      if (data.type === 'time') {
        serverOffset = data.now - Date.now();
      }
      if (data.type === 'blessing') {
        blessings.push(data.message);
        pushDanmaku(data.message);
      }
    });

    function format(num) { return num.toString().padStart(2, '0'); }

    function tickTime() {
      const now = new Date(Date.now() + serverOffset);
      const hh = format(now.getHours());
      const mm = format(now.getMinutes());
      const ss = format(now.getSeconds());
      immersiveTimeEl.textContent = `${hh}:${mm}:${ss}`;
      immersiveDateEl.textContent = `${now.getFullYear()}-${format(now.getMonth() + 1)}-${format(now.getDate())}`;
      requestAnimationFrame(tickTime);
    }
    tickTime();

    function pushDanmaku(message) {
      if (!message || !message.text) return;
      const el = document.createElement('div');
      el.className = 'danmaku-item';
      el.textContent = message.text;
      const layerHeight = danmakuLayer.clientHeight || window.innerHeight;
      const top = Math.random() * (layerHeight - 40) + 10;
      el.style.top = `${top}px`;
      const duration = 16 + Math.random() * 10; // slower sweep
      el.style.animationDuration = `${duration}s`;
      danmakuLayer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function sendBlessing() {
      const text = messageInput.value.trim();
      if (!text) return;
      socket.send(JSON.stringify({ type: 'blessing', text }));
      messageInput.value = '';
    }

    sendButton.addEventListener('click', sendBlessing);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendBlessing();
      }
    });

    // Fireworks background (minimal, reusing prior particle logic)
    const sky = document.getElementById('sky');
    const skyCtx = sky.getContext('2d');
    let particles = [];
    let lastTime = 0;

    function resizeSky() {
      sky.width = window.innerWidth;
      sky.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeSky);
    resizeSky();

    function createBurst(x, y) {
      const hue = Math.random() * 360;
      for (let i = 0; i < 80; i++) {
        particles.push({
          x,
          y,
          angle: Math.random() * Math.PI * 2,
          speed: Math.random() * 4 + 1.5,
          radius: Math.random() * 2 + 0.6,
          color: `hsla(${hue + Math.random() * 40 - 20}, 85%, 65%, 0.9)`,
          alpha: 1,
        });
      }
    }

    function animateSky(ts) {
      const delta = ts - lastTime;
      lastTime = ts;
      skyCtx.fillStyle = 'rgba(5, 10, 24, 0.35)';
      skyCtx.fillRect(0, 0, sky.width, sky.height);

      particles.forEach((p) => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed + 0.4;
        p.speed *= 0.986;
        p.alpha -= 0.008;
        skyCtx.globalAlpha = Math.max(p.alpha, 0);
        const gradient = skyCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 4);
        gradient.addColorStop(0, p.color);
        gradient.addColorStop(1, 'transparent');
        skyCtx.fillStyle = gradient;
        skyCtx.beginPath();
        skyCtx.arc(p.x, p.y, p.radius * 3.2, 0, Math.PI * 2);
        skyCtx.fill();
      });
      particles = particles.filter((p) => p.alpha > 0);

      if (delta > 0 && Math.random() < 0.015) {
        createBurst(Math.random() * sky.width, Math.random() * sky.height * 0.6 + sky.height * 0.1);
      }
      requestAnimationFrame(animateSky);
    }
    animateSky(0);
  </script>
</body>
</html>
